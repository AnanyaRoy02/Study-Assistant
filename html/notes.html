
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes | StudyMate</title>

    <link rel="stylesheet" href="../css/style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                <i class="ri-book-open-line"></i>
            </div>

            <div class="logo-text">
                <h2>StudyMate</h2>
                <span>Study Assistant</span>
            </div>

        </div>


        <nav class="nav-menu">

            <a href="index.html" class="nav-item">
                <i class="ri-dashboard-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="assistant.html" class="nav-item">
                <i class="ri-sparkling-2-line"></i>
                <span>Study Assistant</span>
            </a>

            <a href="quiz.html" class="nav-item">
                <i class="ri-questionnaire-line"></i>
                <span>Quiz</span>
            </a>

            <a href="tasks.html" class="nav-item">
                <i class="ri-task-line"></i>
                <span>Tasks</span>
            </a>

            <a href="notes.html" class="nav-item active">
                <i class="ri-sticky-note-line"></i>
                <span>Notes</span>
            </a>

            <a href="progress.html" class="nav-item">
                <i class="ri-bar-chart-box-line"></i>
                <span>Progress</span>
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <div class="page-container">

            <div class="page-title">

                <span class="card-label">KNOWLEDGE</span>

                <h1>My Notes 📝</h1>

                <p>
                    Save important concepts for revision.
                </p>

            </div>


            <div class="page-card">

                <h2>Create a Note</h2>

                <br>


                <div class="form-group">

                    <label for="noteTitle">
                        Note Title
                    </label>

                    <input
                        type="text"
                        id="noteTitle"
                        class="form-control"
                        placeholder="e.g. JavaScript Promises">

                </div>


                <div class="form-group">

                    <label for="noteSubject">
                        Subject
                    </label>

                    <select id="noteSubject" class="form-control">

                        <option>JavaScript</option>
                        <option>Machine Learning</option>
                        <option>DBMS</option>
                        <option>Computer Networks</option>
                        <option>Other</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="noteContent">
                        Note
                    </label>

                    <textarea
                        id="noteContent"
                        class="form-control"
                        placeholder="Write your notes here..."></textarea>

                </div>


                <button id="saveNoteBtn" class="action-button">

                    <i class="ri-save-line"></i>

                    Save Note

                </button>

            </div>


            <div class="notes-grid" id="notesGrid">

                <p class="empty-message">
                    No notes created yet.
                </p>

            </div>

        </div>

    </main>

</div>


<script src="../js/notes.js"></script>

</body>
</html>
